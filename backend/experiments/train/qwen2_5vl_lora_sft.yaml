### 감귤 병해충 QA — Qwen2.5-VL-7B LoRA SFT (LLaMA-Factory)
### 소량 데이터(train 384=원본96+증강288) → 비전타워 동결 + LoRA(LLM)로 과적합 완화

### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 589824          # 768x768 상한 (시각 토큰 억제)
image_min_pixels: 50176           # 224x224 하한
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true         # 비전타워 동결(소량데이터 안전)
freeze_multi_modal_projector: true

### dataset
dataset: citrus_ft
dataset_dir: __REPO__/data/vlm_finetune
template: qwen2_vl
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: __REPO__/models/qwen2_5vl_lora
logging_steps: 5
save_steps: 48          # 1 에폭 = 48 step → 에폭마다 체크포인트 저장
save_total_limit: 12    # 에폭별 체크포인트 모두 보존(각 checkpoint의 test F1 곡선용)
plot_loss: true
overwrite_output_dir: false
report_to: none

### resume: 서버 크래시로 ep6(step288) 손상 → ep5(step240)부터 재개하여 ep6~10 학습
# resume_from_checkpoint: __REPO__/models/qwen2_5vl_lora/checkpoint-240   # 원 실행 때 재개 지점

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4    # effective batch = 8
learning_rate: 1.0e-4
num_train_epochs: 10.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
