### 감귤 병해충 + 정상 9클래스 — Qwen3.5-4B LoRA SFT (LLaMA-Factory)
### 기존 8클래스(질병) + 정상 40장 추가. 데이터: data/vlm_finetune_9cls (train 474 / test 35)

### model
model_name_or_path: Qwen/Qwen3.5-4B
image_max_pixels: 262144          # 512x512 (GPU2 15GB 여유 → 메모리 절감)
image_min_pixels: 50176
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset
dataset: citrus_ft_9cls
dataset_dir: /home/jhlee/CLUST_KETI/keti-pest-disease-qa/data/vlm_finetune_9cls
template: qwen3_5_nothink
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: /home/jhlee/CLUST_KETI/keti-pest-disease-qa/models/qwen3_5_9cls_lora
logging_steps: 5
save_steps: 60          # 1 에폭 = 60 step(train 474 / eff.batch 8)
save_total_limit: 10
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8    # effective batch = 8 (batch1 → 메모리 절감)
gradient_checkpointing: true
learning_rate: 1.0e-4
num_train_epochs: 8.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
